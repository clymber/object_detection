[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object_ctrl"
version = "0.1.0"
description = "YOLO object-detection experiments and Apple Silicon MPS environment checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Clymber Loong", email = "clymberloong@gamil.com" }
]

keywords = [
    "apple-silicon",
    "computer-vision",
    "jupyter",
    "mps",
    "object-detection",
    "pytorch",
    "ultralytics",
    "yolo",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
data = [
    "polars",
    "scikit-learn",
    "scipy",
]

dev = [
    "black",
    "mypy",
    "pytest",
    "ruff",
]

notebook = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "jupytext",
    "notebook",
]

vision = [
    "opencv-python",
    "psutil",
]

yolo = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "ultralytics",
    "ultralytics-thop",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["object_ctrl", "object_ctrl.*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E402", "E501", "I001"]
"*/notebooks/*.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--ignore=tests/test_colab_setup.py",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that check multiple components together",
    "mps: tests that require Apple Metal/MPS acceleration",
    "slow: tests that are slow or require larger datasets",
]
