name: objctrl

channels:
  - conda-forge

variables:
  # Let PyTorch run unsupported MPS ops, such as torchvision NMS, on CPU.
  PYTORCH_ENABLE_MPS_FALLBACK: "1"

dependencies:
  # Core Python
  - python=3.11
  - pip

  # Jupyter / notebook workflow
  - jupyterlab
  - notebook
  - ipykernel
  - jupytext
  - ipywidgets

  # Scientific / data tools
  - numpy
  - pandas
  - matplotlib
  - scipy
  - scikit-learn
  - pillow
  - pyyaml
  - tqdm

  # Developer tools
  - black
  - ruff
  - pytest

  # Useful for image/video handling
  - ffmpeg
  - psutil
  - requests
  - polars

  # COCO dataet handling
  - pycocotools

  # Notebook helper packages
  - python-dotenv

  # Keep PyTorch in Conda so it shares the Conda OpenMP runtime.
  - pytorch=2.10
  - torchvision=0.25
  - torchaudio=2.10

  # Install pip-only YOLO/Roboflow packages after Conda has installed PyTorch.
  # Keep their OpenCV requirements in pip so Roboflow's pin can install.
  - pip:
      - ultralytics
      - ultralytics-thop
      # YOLOX train/eval dependencies. Install the local YOLOX checkout
      # separately with --no-build-isolation --no-deps; see README.md.
      - loguru
      - thop
      - ninja
      - tabulate
      - tensorboard
      # Match Roboflow's headless OpenCV pin to avoid mixed cv2 versions.
      - opencv-python==4.10.0.84
      - supervision
      - roboflow
      - datumaro
