name: object-detection-dataset

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - pytest

  - ipykernel
  - ipywidgets
  - jinja2
  - numpy<2.4
  - pandas>=2.3,<3
  - pillow
  - scikit-learn

  # PyTorch
  - pytorch=2.10
  - torchvision=0.25

  - pip:
      - fiftyone==1.22.1

      # Dataset management
      - datumaro==1.13.11
      - ImageHash>=4.3,<5
      - roboflow==1.4.2
