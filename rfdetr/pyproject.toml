[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rfdetr-pipeline"
version = "0.1.0"
description = "RF-DETR training, inference, and artifact exports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "detection-common==0.1.0",
    "detection-evaluation==0.1.0",
    "dataset-builder==0.1.0",
    "pandas",
    "pillow",
    "rfdetr>=1.10,<1.11",
]

[project.scripts]
object-detection-rfdetr-onnx = "rfdetr_pipeline.onnx_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
src = ["src"]
