name: object-detection-rfdetr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytest
  - pytorch=2.10
  - torchvision=0.25
  - pycocotools
  - numpy>=2.2,<2.4
  - pandas>=2.3,<3
  - pyyaml
  - pillow
  - matplotlib
  - ipykernel
  - ipywidgets
  - pip:
      # This macOS wheel omits libavdevice, avoiding PyAV's AVFoundation clash.
      - opencv-python-headless==4.11.0.86
      - rfdetr[onnx,train,coreml]==1.11.2
      - supervision==0.30.2
      - onnxruntime
      - coremltools>=8,<10
