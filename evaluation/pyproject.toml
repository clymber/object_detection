[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-evaluation"
version = "0.1.0"
description = "Framework-neutral detector evaluation and artifact validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["detection-common==0.1.0", "numpy", "pandas", "pillow", "pycocotools", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
src = ["src"]
